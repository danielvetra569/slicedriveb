
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#facc15">
<title>VideoKu - Tonton Video</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff8dc !important;
  color: #29230b;
  font-family: Arial, sans-serif;
}

.site-header {
  background: #facc15 !important;
  padding: 20px;
  color: #29230b;
}

.brand {
  color: #29230b !important;
  font-size: 24px;
  font-weight: bold;
  text-decoration: none;
}

.watch-wrap {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
}

.player-section {
  background: #fff !important;
  border: 3px solid #facc15;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 5px 20px #00000010;
}

.featured-player {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  min-height: 220px;
}

.featured-player video {
  display: block;
  width: 100%;
  max-height: 70vh;
  background: #111;
}

.player-placeholder {
  color: white;
  text-align: center;
  padding: 45px 15px;
}

.play-icon {
  font-size: 38px;
  color: #facc15;
}

.featured-title {
  color: #29230b;
  margin-top: 20px;
}

.featured-description {
  color: #746b50;
  line-height: 1.6;
  white-space: pre-wrap;
}

.ad-container {
  margin: 20px 0;
  display: flex;
  justify-content: center;
  overflow-x: auto;
}

.footer {
  text-align: center;
  color: #8a7a4a;
  padding: 25px 10px;
}

@media(max-width:600px) {
  .player-section {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="/">VideoKu</a>
</header>

<main class="watch-wrap">
<section class="player-section">

  <div class="featured-player">
    <video id="mainVideo" controls playsinline preload="metadata" hidden></video>

    <div id="playerMessage" class="player-placeholder">
      <div class="play-icon">▶</div>
      <p>Sedang memuat video...</p>
    </div>
  </div>

  <h2 id="mainTitle" class="featured-title">VideoKu</h2>
  <p id="mainDescription" class="featured-description"></p>

</section>
</main>

<footer class="footer">VideoKu · Koleksi Video</footer>

<script>
const SUPABASE_URL = "https://kbesxoueqynthvqtayww.supabase.co";
const SUPABASE_KEY = "sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function muatVideo() {
  const params = new URLSearchParams(location.search);
  const parts = location.pathname.split("/").filter(Boolean);

  let code = params.get("code") || "";

  if (!code && parts[0]?.toLowerCase() === "e") {
    code = parts[1] || "";
  }

  code = decodeURIComponent(code).trim().toUpperCase();

  const message = document.getElementById("playerMessage");
  const video = document.getElementById("mainVideo");

  if (!code || code.toLowerCase() === "index.html") {
    message.innerHTML = "<p>Link video tidak lengkap.</p>";
    return;
  }

  try {
    const { data, error } = await db
      .from("videos")
      .select("title, description, storage_path")
      .eq("share_code", code)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      message.innerHTML = "<p>Video tidak ditemukan.</p>";
      return;
    }

    const result = db.storage
      .from("videos")
      .getPublicUrl(data.storage_path);

    video.src = result.data.publicUrl;
    video.hidden = false;
    video.load();

    document.getElementById("mainTitle").textContent =
      data.title || "Tanpa judul";

    document.getElementById("mainDescription").textContent =
      data.description || "";

    message.style.display = "none";

    video.addEventListener("error", () => {
      message.style.display = "block";
      message.innerHTML = "<p>Video gagal dimuat.</p>";
    });

  } catch (error) {
    console.error(error);
    message.innerHTML = "<p>Gagal memuat video.</p>";
  }
}

muatVideo();
</script>

</body>
</html>
