<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#fffbeb;
  color:#1f1b08;
  font-family:Arial,sans-serif;
}
header{
  background:#facc15;
  padding:16px 5%;

.status{

}
footer{
  text-align:center;
  color:#713f12;
  background:#fef08a;
  border-top:2px solid #facc15;
  padding:22px;
  margin-top:40px;
  font-weight:bold;
}

/* CSS Tambahan untuk Posisi Iklan Banner */
.ad-container {
  margin: 20px 0;
  padding: 10px;
  background: #fef08a;
  border: 1px solid #eab308;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  overflow-x: auto;
}
</style>
</head>
<body>
<header><a href="/">VideoKu</a></header>
<main>

  <!-- ========================================== -->
  <!-- 2. IKLAN BANNER (728x90)                   -->
  <!-- ========================================== -->
  <div class="ad-container">
    <script>
      atOptions = {
        'key' : '489342048df66e3789ebbcf95f4a12e2',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script src="https://bancadeltempoidea.org/22/489342048df66e3789ebbcf95f4a12e2"></script>
  </div>

  <section class="player">
    <div id="status" class="status">Memuat video...</div>
    <video id="video" controls playsinline preload="metadata" hidden></video>
    <h1 id="title" hidden></h1>
    <p id="description" hidden></p>
  </section>

</main>
<footer>VideoKu · Koleksi Video</footer>

<script>
const SUPABASE_URL = "https://kbesxoueqynthvqtayww.supabase.co";
const SUPABASE_KEY = "sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function muatVideo() {
  const pathSegments = location.pathname.split("/").filter(Boolean);
  const code = (
    new URLSearchParams(location.search).get("code") ||
    pathSegments[pathSegments.length - 1] ||
    ""
  ).toUpperCase();

  const status = document.getElementById("status");

  if (!code || code === "E" || code === "E.HTML" || code === "INDEX.HTML") {
    status.textContent = "Link video tidak lengkap.";
    return;
  }

  const { data, error } = await db
    .from("videos")
    .select("title, description, storage_path")
    .eq("share_code", code)
    .maybeSingle();

  if (error || !data) {
    status.textContent = "Video tidak ditemukan atau link tidak valid.";
    return;
  }

  const url = db.storage.from("videos").getPublicUrl(data.storage_path).data.publicUrl;

  const video = document.getElementById("video");
  video.src = url;
  video.hidden = false;

  document.getElementById("title").textContent = data.title || "Tanpa judul";
  document.getElementById("title").hidden = false;

  document.getElementById("description").textContent = data.description || "";
  document.getElementById("description").hidden = false;

  status.hidden = true;
}

muatVideo();
</script>
</body>
</html>
