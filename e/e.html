
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6554db">
<title>VideoKu - Tonton Video</title>

<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.watch-wrap {
  max-width: 850px;
  margin: 30px auto;
}
.player-section {
  padding: 18px;
}
.featured-player {
  max-width: 460px;
  width: 100%;
  aspect-ratio: 9 / 16;
  margin: auto;
  background: #111;
  border-radius: 13px;
  overflow: hidden;
  position: relative;
}
.featured-player video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #111;
}
.player-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  pointer-events: none;
}
.featured-title {
  overflow-wrap: anywhere;
}
@media(max-width:600px) {
  .watch-wrap {
    margin: 15px auto;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="/">VideoKu</a>
  <a class="admin-link" href="/admin.html">Admin</a>
</header>

<main class="watch-wrap">
  <section class="player-section">

    <div class="featured-player">
      <video id="mainVideo"
        controls
        playsinline
        preload="metadata">
      </video>

      <div id="playerMessage" class="player-placeholder">
        Memuat video...
      </div>
    </div>

    <h2 id="mainTitle" class="featured-title">
      VideoKu
    </h2>

    <p id="mainDescription" class="featured-description"></p>

  </section>
</main>

<footer class="footer">
  VideoKu · Koleksi Video
</footer>

<script>
const SUPABASE_URL =
"https://kbesxoueqynthvqtayww.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function muatVideo() {
  const params = new URLSearchParams(location.search);

  const parts = location.pathname
    .split("/")
    .filter(Boolean);

  let code =
    params.get("code") ||
    (parts[0]?.toLowerCase() === "e"
      ? parts[1]
      : parts[parts.length - 1]) ||
    "";

  code = decodeURIComponent(code).trim().toUpperCase();

  const message = document.getElementById("playerMessage");
  const player = document.getElementById("mainVideo");

  if (!code || code === "E.HTML") {
    message.textContent = "Link video tidak lengkap.";
    return;
  }

  try {
    const { data, error } = await db
      .from("videos")
      .select("title, description, storage_path")
      .eq("share_code", code)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      message.textContent = "Video tidak ditemukan.";
      return;
    }

    const result = db.storage
      .from("videos")
      .getPublicUrl(data.storage_path);

    if (!result.data.publicUrl) {
      throw new Error("URL video tidak tersedia");
    }

    player.src = result.data.publicUrl;
    player.load();

    document.getElementById("mainTitle").textContent =
      data.title || "Tanpa judul";

    document.getElementById("mainDescription").textContent =
      data.description || "";

    message.style.display = "none";

    player.addEventListener("error", () => {
      message.style.display = "flex";
      message.textContent = "Video gagal dimuat. Silakan coba lagi.";
    });

  } catch (err) {
    console.error(err);
    message.textContent = "Gagal memuat video. Silakan coba lagi.";
  }
}

muatVideo();
</script>

</body>
</html>
