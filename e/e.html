
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#facc15">
<title>VideoKu - Tonton Video</title>

<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  background: #fffbea !important;
  color: #29230b !important;
  font-family: Arial, sans-serif;
}

.site-header {
  background: linear-gradient(120deg,#eab308,#facc15) !important;
  color: #29230b !important;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  color: #29230b !important;
  font-size: 23px;
  font-weight: bold;
  text-decoration: none;
}

.admin-link {
  color: #29230b !important;
  text-decoration: none;
  font-weight: bold;
}

.watch-wrap {
  max-width: 850px;
  margin: 28px auto;
  padding: 0 14px;
}

.player-section {
  background: #ffffff !important;
  border: 2px solid #facc15;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 5px 22px rgba(120,90,0,.10);
}

.featured-player {
  width: 100%;
  max-width: 460px;
  aspect-ratio: 9 / 16;
  margin: auto;
  background: #111;
  border-radius: 12px;
  overflow: hidden;
}

.featured-player video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #111;
}

.featured-title {
  font-size: 21px;
  margin: 20px 0 8px;
  overflow-wrap: anywhere;
  color: #29230b;
}

.featured-description {
  color: #6b6250;
  line-height: 1.6;
  white-space: pre-wrap;
}

.status {
  text-align: center;
  padding: 15px;
  color: #a16207;
}

.footer {
  text-align: center;
  color: #8a7a4a;
  padding: 25px 10px;
}

@media(max-width:600px) {
  .watch-wrap { margin: 15px auto; }
  .player-section { padding: 12px; }
}
</style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="/">VideoKu</a>
  <a class="admin-link" href="/admin.html">Admin</a>
</header>

<main class="watch-wrap">
  <section class="player-section">

    <div id="status" class="status">Memuat video...</div>

    <div class="featured-player">
      <video id="mainVideo" controls playsinline preload="metadata">
        Browser tidak mendukung pemutar video.
      </video>
    </div>

    <h2 id="mainTitle" class="featured-title">VideoKu</h2>
    <p id="mainDescription" class="featured-description"></p>

  </section>
</main>

<footer class="footer">VideoKu</footer>

<script>
const SUPABASE_URL = "https://kbesxoueqynthvqtayww.supabase.co";
const SUPABASE_KEY = "sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";

const statusBox = document.getElementById("status");
const video = document.getElementById("mainVideo");

async function loadVideo() {
  try {
    if (!window.supabase) {
      throw new Error("Library Supabase gagal dimuat.");
    }

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const params = new URLSearchParams(location.search);
    const parts = location.pathname.split("/").filter(Boolean);

    let code = params.get("code") || "";

    if (!code && parts[0]?.toLowerCase() === "e") {
      code = parts[1] || "";
    }

    code = decodeURIComponent(code).trim().toUpperCase();

    if (!code) {
      statusBox.textContent = "Link video tidak lengkap.";
      return;
    }

    const { data, error } = await db
      .from("videos")
      .select("title, description, storage_path")
      .eq("share_code", code)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      statusBox.textContent = "Video tidak ditemukan.";
      return;
    }

    const { data: publicData } = db.storage
      .from("videos")
      .getPublicUrl(data.storage_path);

    if (!publicData?.publicUrl) {
      throw new Error("Alamat video tidak tersedia.");
    }

    document.getElementById("mainTitle").textContent =
      data.title || "Tanpa judul";

    document.getElementById("mainDescription").textContent =
      data.description || "";

    video.src = publicData.publicUrl;
    video.load();

    statusBox.textContent = "Video berhasil dimuat. Tekan tombol putar.";

    video.addEventListener("loadedmetadata", () => {
      statusBox.style.display = "none";
    }, { once: true });

    video.addEventListener("error", () => {
      statusBox.style.display = "block";
      statusBox.textContent = "Video gagal diputar.";
    });

  } catch (error) {
    console.error("VideoKu:", error);
    statusBox.textContent = error.message || "Gagal memuat video.";
  }
}

loadVideo();
</script>

</body>
</html>
