
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#635bdb">
<title>VideoKu - Tonton Video</title>

<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  background: #f5f6fc;
  color: #25243a;
  font-family: Arial, sans-serif;
}
.site-header {
  background: linear-gradient(120deg,#635bdb,#8275ed);
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand {
  color: white;
  font-size: 23px;
  font-weight: bold;
  text-decoration: none;
}
.admin-link {
  color: white;
  text-decoration: none;
}
.watch-wrap {
  max-width: 850px;
  margin: 28px auto;
  padding: 0 14px;
}
.player-section {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 5px 22px rgba(30,25,90,.08);
}
.featured-player {
  width: 100%;
  max-width: 460px;
  aspect-ratio: 9 / 16;
  margin: auto;
  background: #111;
  border-radius: 12px;
  overflow: hidden;
}
.featured-player video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #111;
}
.featured-title {
  font-size: 21px;
  margin: 20px 0 8px;
  overflow-wrap: anywhere;
}
.featured-description {
  color: #68677a;
  line-height: 1.6;
  white-space: pre-wrap;
}
.status {
  text-align: center;
  padding: 15px;
  color: #635bdb;
}
.footer {
  text-align: center;
  color: #777;
  padding: 25px 10px;
}
@media(max-width:600px) {
  .watch-wrap { margin: 15px auto; }
  .player-section { padding: 12px; }
}
</style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="/">VideoKu</a>
  <a class="admin-link" href="/admin.html">Admin</a>
</header>

<main class="watch-wrap">
  <section class="player-section">

    <div id="status" class="status">Memuat video...</div>

    <div class="featured-player">
      <video id="mainVideo" controls playsinline preload="metadata">
        Browser tidak mendukung pemutar video.
      </video>
    </div>

    <h2 id="mainTitle" class="featured-title">VideoKu</h2>
    <p id="mainDescription" class="featured-description"></p>

  </section>
</main>

<footer class="footer">VideoKu</footer>

<script>
const SUPABASE_URL =
  "https://kbesxoueqynthvqtayww.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadVideo() {
  const params = new URLSearchParams(location.search);

  const code = (
    params.get("code") ||
    location.pathname.split("/").filter(Boolean).pop() ||
    ""
  ).trim().toUpperCase();

  const status = document.getElementById("status");
  const video = document.getElementById("mainVideo");

  if (!code || code.toLowerCase() === "e.html") {
    status.textContent = "Link video tidak lengkap.";
    return;
  }

  try {
    const { data, error } = await db
      .from("videos")
      .select("title, description, storage_path")
      .eq("share_code", code)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      status.textContent = "Video tidak ditemukan.";
      return;
    }

    const { data: publicData } = db.storage
      .from("videos")
      .getPublicUrl(data.storage_path);

    if (!publicData || !publicData.publicUrl) {
      throw new Error("Alamat video tidak tersedia.");
    }

    document.getElementById("mainTitle").textContent =
      data.title || "Tanpa judul";

    document.getElementById("mainDescription").textContent =
      data.description || "";

    video.src = publicData.publicUrl;
    video.load();

    status.textContent = "Video berhasil dimuat.";
    video.addEventListener("loadedmetadata", () => {
      status.style.display = "none";
    }, { once: true });

    video.addEventListener("error", () => {
      status.style.display = "block";
      status.textContent = "Video gagal diputar. Silakan coba lagi.";
    });

  } catch (error) {
    console.error(error);
    status.textContent = "Gagal memuat video. Silakan coba lagi.";
  }
}

loadVideo();
</script>

</body>
</html>
