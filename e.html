
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoKu - Tonton Video</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;color:#202536;font-family:Arial,sans-serif}
header{background:#fff;padding:18px 5%;box-shadow:0 2px 10px #0001}
header a{font-size:23px;font-weight:bold;color:#635bdb;text-decoration:none}
main{max-width:850px;margin:35px auto;padding:0 16px}
.player{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 20px #0000000d}
video{width:100%;background:#111;border-radius:10px;display:block;max-height:65vh}
h1{font-size:23px;margin:20px 0 10px}
p{color:#697386;line-height:1.6}
.status{text-align:center;padding:35px 10px}
footer{text-align:center;color:#8990a0;padding:30px}
</style>
</head>
<body>
<header><a href="/">VideoKu</a></header>
<main>
<section class="player">
<div id="status" class="status">Memuat video...</div>
<video id="video" controls playsinline preload="metadata" hidden></video>
<h1 id="title" hidden></h1>
<p id="description" hidden></p>
</section>
</main>
<footer>VideoKu · Koleksi Video</footer>

<script>
const SUPABASE_URL = "https://kbesxoueqynthvqtayww.supabase.co";
const SUPABASE_KEY = "sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function muatVideo() {
  const code = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "").toUpperCase();
  const status = document.getElementById("status");

  if (!code || code === "E") {
    status.textContent = "Link video tidak lengkap.";
    return;
  }

  const { data, error } = await db
    .from("videos")
    .select("title, description, storage_path")
    .eq("share_code", code)
    .maybeSingle();

  if (error || !data) {
    status.textContent = "Video tidak ditemukan atau link tidak valid.";
    return;
  }

  const url = db.storage.from("videos").getPublicUrl(data.storage_path).data.publicUrl;

  const video = document.getElementById("video");
  video.src = url;
  video.hidden = false;

  document.getElementById("title").textContent = data.title || "Tanpa judul";
  document.getElementById("title").hidden = false;

  document.getElementById("description").textContent = data.description || "";
  document.getElementById("description").hidden = false;

  status.hidden = true;
}

muatVideo();
</script>
</body>
</html>
