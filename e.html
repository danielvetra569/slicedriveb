
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#635bdb">
<title>VideoKu - Tonton Video</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f5f6fa;
  color: #202331;
  font-family: Arial, sans-serif;
}

header {
  background: #635bdb;
  color: white;
  padding: 18px 6%;
  font-size: 21px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 0 14px;
}

.ad-banner {
  min-height: 90px;
  background: #fff8d9;
  border: 1px dashed #d6bd52;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8b7830;
  margin-bottom: 18px;
  text-align: center;
}

.video-box {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

video {
  width: 100%;
  background: black;
  border-radius: 8px;
}

h2 { font-size: 20px; }

.ad-smartlink {
  margin-top: 18px;
  padding: 20px;
  background: white;
  border: 1px dashed #ccc;
  border-radius: 8px;
  text-align: center;
  color: #888;
}

#status {
  text-align: center;
  padding: 25px;
}
</style>
</head>

<body>

<header>VideoKu</header>

<div class="container">

  <div class="ad-banner">TEMPAT IKLAN BANNER</div>

  <div id="status">Memuat video...</div>

  <div class="video-box" id="videoBox" hidden>
    <video id="player" controls playsinline></video>
    <h2 id="videoTitle"></h2>
    <p id="videoDescription"></p>
  </div>

  <div class="ad-smartlink">
    TEMPAT IKLAN SMARTLINK
  </div>

</div>

<script>
async function tampilkanVideo() {
  const code = new URLSearchParams(location.search).get("code");
  const status = document.getElementById("status");

  if (!code) {
    status.textContent = "Kode video tidak ditemukan.";
    return;
  }

  try {
    const response = await fetch("./videos.json");

    if (!response.ok) {
      throw new Error("Daftar video tidak bisa dimuat.");
    }

    const daftar = await response.json();
    const video = daftar.videos.find(item => item.code === code);

    if (!video) {
      status.textContent = "Video tidak ditemukan.";
      return;
    }

    const player = document.getElementById("player");
    player.src = video.url;
    player.load();

    document.getElementById("videoTitle").textContent = video.title || "";
    document.getElementById("videoDescription").textContent =
      video.description || "";

    document.getElementById("videoBox").hidden = false;
    status.hidden = true;

  } catch (error) {
    status.textContent = "Gagal memuat video. Silakan coba lagi.";
    console.error(error);
  }
}

tampilkanVideo();
</script>

</body>
</html>
