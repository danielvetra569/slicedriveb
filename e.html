.ad-smartlink {
  margin-top: 18px;

  background: #fff;
  border: 1px dashed #ccc;
  border-radius: 8px;
  text-align: center;
  color: #888;

}

.video-box {
  background: white;

  width: 100%;

  background: #000;
  border-radius: 8px;

  font-size: 20px;

  text-align: center;

<body>

<header>VideoKu</header>

<div class="container">

  <!-- BANNER IFRAME 728x90 -->
  <div class="ad-banner">
    <script>
      atOptions = {
        'key' : '489342048df66e3789ebbcf95f4a12e2',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script src="https://bancadeltempoidea.org/22/489342048df66e3789ebbcf95f4a12e2"></script>
  </div>

  <div id="status">Memuat video...</div>

  <div class="video-box" id="videoBox" hidden>
    <video id="player" controls playsinline></video>
    <h2 id="videoTitle"></h2>
    <p id="videoDescription"></p>
  </div>

  <!-- NATIVE BANNER & SMARTLINK -->
  <div class="ad-smartlink">
    <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/580538d6da5e19898741a77320afdabd"></script>
    <div id="container-580538d6da5e19898741a77320afdabd"></div>
    <div style="margin-top: 10px;">
      <a href="https://aarems.org/1/83cc953206f8c39205033005bd3e6c1a" target="_blank" rel="noopener noreferrer">Lihat Info &amp; Penawaran</a>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://kbesxoueqynthvqtayww.supabase.co";
const SUPABASE_KEY = "sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function tampilkanVideo() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");

  const status = document.getElementById("status");

  if (!code) {
    status.textContent = "Link video tidak valid.";
    return;
  }

  const { data, error } = await db
    .from("videos")
    .select("title, description, storage_path")
    .eq("share_code", code)
    .maybeSingle();

  if (error) {
    status.textContent = "Gagal mengambil video.";
    console.error(error);
    return;
  }

  if (!data) {
    status.textContent = "Video tidak ditemukan.";
    return;
  }

  const { data: fileData } = db.storage
    .from("videos")
    .getPublicUrl(data.storage_path);

  document.getElementById("player").src = fileData.publicUrl;
  document.getElementById("videoTitle").textContent = data.title || "";
  document.getElementById("videoDescription").textContent =
    data.description || "";

  document.getElementById("videoBox").hidden = false;
  status.hidden = true;
}

tampilkanVideo();
</script>

</body>
</html>
