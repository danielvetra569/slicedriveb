
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#635bdb">
<title>VideoKu - Tonton Video</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f5f6fa;
  color: #202331;
  font-family: Arial, sans-serif;
}

header {
  background: #635bdb;
  color: white;
  padding: 18px 6%;
  font-size: 21px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 0 14px;
}

.ad-native {
  margin-top: 18px;
  padding: 15px;
  background: white;
  border: 1px solid #e2e5ee;
  border-radius: 8px;
}

.video-box {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

video {
  width: 100%;
  background: black;
  border-radius: 8px;
}

h2 { font-size: 20px; }

#status {
  text-align: center;
  padding: 25px;
}
</style>
</head>

<body>

<header>VideoKu</header>

<div class="container">

  <div id="status">Memuat video...</div>

  <div class="video-box" id="videoBox" hidden>
    <video id="player" controls playsinline autoplay muted></video>
    <h2 id="videoTitle"></h2>
    <p id="videoDescription"></p>
  </div>

  <!-- NATIVE BANNER -->
  <div class="ad-native">
    <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/580538d6da5e19898741a77320afdabd"></script>
    <div id="container-580538d6da5e19898741a77320afdabd"></div>
  </div>

</div>

<script>
function ambilKodeVideo() {
  const fromQuery = new URLSearchParams(location.search).get("code");
  if (fromQuery) return fromQuery.trim();

  const segments = location.pathname.split("/").filter(Boolean);
  const last = segments[segments.length - 1] || "";

  if (!last || ["e", "e.html", "index.html"].includes(last.toLowerCase())) {
    return "";
  }

  return decodeURIComponent(last).trim();
}

async function tampilkanVideo() {
  const code = ambilKodeVideo();
  const status = document.getElementById("status");

  if (!code) {
    status.textContent = "Kode video tidak ditemukan.";
    return;
  }

  try {
    const response = await fetch("./videos.json");

    if (!response.ok) {
      throw new Error("Daftar video tidak bisa dimuat.");
    }

    const daftar = await response.json();
    const video = daftar.videos.find(
      item => String(item.code).toUpperCase() === code.toUpperCase()
    );

    if (!video) {
      status.textContent = "Video tidak ditemukan.";
      return;
    }

    const player = document.getElementById("player");

    player.src = video.url;
    player.muted = true;
    player.load();

    document.getElementById("videoTitle").textContent = video.title || "";
    document.getElementById("videoDescription").textContent =
      video.description || "";

    document.getElementById("videoBox").hidden = false;
    status.hidden = true;

    // AUTOPLAY OTOMATIS TANPA SUARA
    player.play().catch(error => {
      console.log("Autoplay tidak diizinkan browser:", error);
    });

  } catch (error) {
    status.textContent = "Gagal memuat video. Silakan coba lagi.";
    console.error(error);
  }
}

tampilkanVideo();
</script>

</body>
</html>
