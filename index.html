<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aciemg - Streaming Video & Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0b0f19',
                            surface: '#131a2a',
                            card: '#1a2336',
                            text: '#f8fafc',
                            muted: '#94a3b8',
                            border: '#27334d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #27334d; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    </style>
    <!-- Adsterra Smart Link / Script Baru -->
    <script data-cfasync="false" src="https://directyp.org/4/a5120427fc012a795efe69433184cb29"></script>
</head>
<body class="bg-dark-bg text-dark-text min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-white">
    
    <!-- Top Adsterra Banner -->
    <div class="w-full bg-dark-surface border-b border-dark-border py-2 text-center overflow-hidden">
        <div class="text-[9px] uppercase tracking-widest text-dark-muted mb-1">Advertisement / Sponsor</div>
        <div class="flex justify-center items-center">
            <script data-cfasync="false" src="https://bancadeltempoidea.org/14/0b6c94865d260b69f091b59cb66be542"></script>
        </div>
    </div>

    <!-- Navbar -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-dark-bg/90 border-b border-dark-border">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilter()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <svg class="w-5 h-5 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">aciemg</span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-xl hidden sm:block">
                <div class="relative">
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="Cari video atau movie..." class="w-full bg-dark-surface border border-dark-border rounded-full pl-5 pr-11 py-2 text-sm focus:outline-none focus:border-cyan-500 transition-colors">
                    <svg class="w-4 h-4 absolute right-4 top-2.5 text-dark-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
            </div>

            <div class="flex items-center space-x-3 shrink-0">
                <a href="https://t.me/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-2 bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-full text-sm font-medium transition-all shadow-lg shadow-sky-500/20">
                    <span>Join Telegram</span>
                </a>
            </div>
        </div>
        <div class="sm:hidden px-4 pb-3">
            <input type="text" id="mobile-search-input" oninput="handleMobileSearch()" placeholder="Cari video..." class="w-full bg-dark-surface border border-dark-border rounded-full px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Category Pills -->
        <div id="category-bar" class="flex items-center gap-2 overflow-x-auto pb-4 mb-4">
            <button onclick="filterCategory('Semua')" class="cat-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-cyan-600 text-white whitespace-nowrap transition-all">Semua</button>
            <button onclick="filterCategory('Movie')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-dark-surface border border-dark-border text-dark-muted hover:text-white whitespace-nowrap transition-all">Movie / Film</button>
            <button onclick="filterCategory('Gaming')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-dark-surface border border-dark-border text-dark-muted hover:text-white whitespace-nowrap transition-all">Gaming</button>
            <button onclick="filterCategory('Hiburan')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-dark-surface border border-dark-border text-dark-muted hover:text-white whitespace-nowrap transition-all">Hiburan</button>
        </div>

        <!-- Watch Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column: Video Player & Details -->
            <div class="lg:col-span-2 space-y-4">
                <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-dark-border shadow-2xl" id="player-wrapper"></div>

                <!-- Adsterra Below Video (Gabungan Banner & Iframe 728x90 Baru) -->
                <div class="bg-dark-surface border border-dark-border rounded-2xl p-4 text-center overflow-hidden space-y-3">
                    <div class="text-[9px] uppercase tracking-widest text-dark-muted">Advertisement</div>
                    <div class="flex justify-center items-center">
                        <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/580538d6da5e19898741a77320afdabd"></script>
                        <div id="container-580538d6da5e19898741a77320afdabd"></div>
                    </div>
                    <!-- Iframe Banner 728x90 Baru -->
                    <div class="flex justify-center items-center overflow-x-auto">
                        <script>
                          atOptions = {
                            'key' : '489342048df66e3789ebbcf95f4a12e2',
                            'format' : 'iframe',
                            'height' : 90,
                            'width' : 728,
                            'params' : {}
                          };
                        </script>
                        <script src="https://bancadeltempoidea.org/22/489342048df66e3789ebbcf95f4a12e2"></script>
                    </div>
                </div>

                <!-- Video Metadata -->
                <div class="bg-dark-surface border border-dark-border rounded-2xl p-5">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <span id="player-category" class="bg-cyan-500/10 text-cyan-400 text-xs font-semibold px-3 py-1 rounded-full border border-cyan-500/20">Kategori</span>
                        <span id="player-date" class="text-xs text-dark-muted">Tanggal</span>
                    </div>
                    <h1 id="player-title" class="text-xl sm:text-2xl font-bold tracking-tight mb-4">Judul Video</h1>

                    <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-dark-border">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-cyan-500 flex items-center justify-center font-bold text-white text-sm">AC</div>
                            <div>
                                <div class="font-semibold text-sm flex items-center gap-1">
                                    <span>aciemg Official</span>
                                    <svg class="w-4 h-4 text-cyan-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                                </div>
                                <div class="text-xs text-dark-muted" id="player-views">1.2K tayangan</div>
                            </div>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button onclick="toggleLike()" id="like-btn" class="flex items-center space-x-2 bg-dark-card hover:bg-slate-800 border border-dark-border px-4 py-2 rounded-full text-xs font-medium transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/></svg>
                                <span id="like-count">0</span>
                            </button>
                            <button onclick="shareVideo()" class="flex items-center space-x-2 bg-dark-card hover:bg-slate-800 border border-dark-border px-4 py-2 rounded-full text-xs font-medium transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                                <span>Bagikan</span>
                            </button>
                        </div>
                    </div>

                    <div class="pt-4">
                        <p id="player-desc" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line">Deskripsi video...</p>
                    </div>
                </div>

                <!-- Adsterra Above Comments -->
                <div class="bg-dark-surface border border-dark-border rounded-2xl p-4 text-center overflow-hidden">
                    <div class="text-[9px] uppercase tracking-widest text-dark-muted mb-1">Advertisement</div>
                    <script data-cfasync="false" src="https://aarems.org/1/83cc953206f8c39205033005bd3e6c1a"></script>
                </div>

                <!-- Comments Section -->
                <div class="bg-dark-surface border border-dark-border rounded-2xl p-5">
                    <h3 class="text-base font-bold mb-4">Komentar (<span id="comment-total">0</span>)</h3>
                    <form onsubmit="addComment(event)" class="flex flex-col sm:flex-row gap-3 mb-6">
                        <input type="text" id="comment-user" placeholder="Nama Anda" required class="sm:w-1/3 bg-dark-bg border border-dark-border rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
                        <input type="text" id="comment-msg" placeholder="Tulis komentar..." required class="flex-1 bg-dark-bg border border-dark-border rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
                        <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-xl text-sm font-medium transition-colors shrink-0">Kirim</button>
                    </form>
                    <div id="comments-container" class="space-y-3"></div>
                </div>
            </div>

            <!-- Right Column: Playlist -->
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold">Daftar Putar Video</h2>
                    <span class="text-xs text-dark-muted" id="playlist-count">0 video</span>
                </div>
                <div id="playlist-container" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-cyan-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        Tautan disalin!
    </div>

    <script>
        let videos = [
            {
                id: 1,
                title: "Bule Viral Maen Sama Warga Desa",
                category: "Movie",
                date: "18 November 2026",
                views: "14.5K tayangan",
                duration: "09:56",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                thumbnail: "https://unsplash.com/id/foto/wanita-hamil-muda-berpakaian-putih-dengan-pemandangan-sawah-bali-di-bawah-sinar-matahari-pagi-harmoni-dengan-alam-konsep-kehamilan-VicWmkCy0xI,
                desc: "Contoh pemutaran film pendek animasi format MP4 HTML5 dengan kontrol penuh pemutar video.",
                likes: 342,
                liked: false,
                comments: [{ user: "Budi Santoso", msg: "Videonya jernih banget dan lancar diputar!" }]
            },
            {
                id: 2,
                title: "Sintel - Film Pendek Fantasi Open Movie",
                category: "Movie",
                date: "17 November 2026",
                views: "8.2K tayangan",
                duration: "14:48",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
                thumbnail: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",
                desc: "Film pendek animasi epik kisah perjalanan seorang gadis mencari naga peliharaannya.",
                likes: 215,
                liked: false,
                comments: []
            },
            {
                id: 3,
                title: "Heboh Seleb Viral Bareng Selingkuhan Hot",
                category: "Movie",
                date: "15 November 2026",
                views: "5.9K tayangan",
                duration: "12:14",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
                thumbnail: "https://unsplash.com/id/foto/seorang-wanita-bergaun-putih-berjalan-melalui-ladang-hijau-subur-DrFZ9WEtbpI
                desc: "Heboh Seleb Viral Bareng Selingkuhan Hot.",
                likes: 189,
                liked: false,
                comments: []
            }
        ];

        let currentVideoId = videos[0].id;
        let activeCategory = 'Semua';

        function playVideo(id) {
            currentVideoId = id;
            const vid = videos.find(v => v.id === id);
            if (!vid) return;

            const wrapper = document.getElementById('player-wrapper');
            wrapper.innerHTML = `
                <video controls autoplay playsinline poster="${vid.thumbnail || ''}" class="w-full h-full object-contain bg-black">
                    <source src="${vid.url}" type="video/mp4">
                    Browser Anda tidak mendukung pemutar video HTML5.
                </video>
            `;

            document.getElementById('player-category').innerText = vid.category;
            document.getElementById('player-date').innerText = vid.date;
            document.getElementById('player-title').innerText = vid.title;
            document.getElementById('player-views').innerText = vid.views;
            document.getElementById('player-desc').innerText = vid.desc;
            document.getElementById('like-count').innerText = vid.likes;

            const likeBtn = document.getElementById('like-btn');
            if (vid.liked) {
                likeBtn.classList.add('text-cyan-400', 'border-cyan-500/50');
            } else {
                likeBtn.classList.remove('text-cyan-400', 'border-cyan-500/50');
            }

            renderComments(vid.comments || []);
            renderPlaylist();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPlaylist(list = videos) {
            const container = document.getElementById('playlist-container');
            document.getElementById('playlist-count').innerText = `${list.length} video`;

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-dark-muted bg-dark-surface rounded-2xl border border-dark-border">Tidak ada video ditemukan.</div>`;
                return;
            }

            container.innerHTML = list.map(vid => {
                const isPlaying = vid.id === currentVideoId;
                return `
                    <div onclick="playVideo(${vid.id})" class="group flex gap-3 p-2.5 rounded-xl border transition-all cursor-pointer ${isPlaying ? 'bg-dark-card border-cyan-500/50' : 'bg-dark-surface border-dark-border hover:border-slate-600'}">
                        <div class="relative w-36 aspect-video rounded-lg overflow-hidden bg-black shrink-0">
                            <img src="${vid.thumbnail || 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=400&q=80'}" alt="${vid.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute bottom-1 right-1 bg-black/80 text-[10px] font-semibold px-1.5 py-0.5 rounded text-white">${vid.duration || 'HD'}</span>
                        </div>
                        <div class="flex flex-col justify-between py-0.5 overflow-hidden">
                            <h3 class="text-xs sm:text-sm font-semibold line-clamp-2 group-hover:text-cyan-400 transition-colors ${isPlaying ? 'text-cyan-400' : 'text-white'}">${vid.title}</h3>
                            <div>
                                <div class="text-[11px] text-dark-muted">${vid.category}</div>
                                <div class="text-[11px] text-dark-muted">${vid.views}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat)) {
                    btn.className = "cat-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-cyan-600 text-white whitespace-nowrap transition-all";
                } else {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-medium bg-dark-surface border border-dark-border text-dark-muted hover:text-white whitespace-nowrap transition-all";
                }
            });

            if (cat === 'Semua') {
                renderPlaylist(videos);
            } else {
                renderPlaylist(videos.filter(v => v.category === cat));
            }
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            document.getElementById('mobile-search-input').value = '';
            filterCategory('Semua');
        }

        function handleSearch() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderPlaylist(videos.filter(v => v.title.toLowerCase().includes(q) || v.desc.toLowerCase().includes(q)));
        }

        function handleMobileSearch() {
            const q = document.getElementById('mobile-search-input').value.toLowerCase();
            renderPlaylist(videos.filter(v => v.title.toLowerCase().includes(q) || v.desc.toLowerCase().includes(q)));
        }

        function toggleLike() {
            const vid = videos.find(v => v.id === currentVideoId);
            if (!vid) return;
            vid.liked = !vid.liked;
            vid.likes += vid.liked ? 1 : -1;
            document.getElementById('like-count').innerText = vid.likes;
            const likeBtn = document.getElementById('like-btn');
            likeBtn.classList.toggle('text-cyan-400', vid.liked);
            likeBtn.classList.toggle('border-cyan-500/50', vid.liked);
        }

        function shareVideo() {
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 2500);
        }

        function renderComments(comments) {
            document.getElementById('comment-total').innerText = comments.length;
            const container = document.getElementById('comments-container');
            if (comments.length === 0) {
                container.innerHTML = `<p class="text-xs text-dark-muted italic">Belum ada komentar.</p>`;
                return;
            }
            container.innerHTML = comments.map(c => `
                <div class="bg-dark-bg p-3.5 rounded-xl border border-dark-border">
                    <div class="font-semibold text-xs text-cyan-400 mb-1">${c.user}</div>
                    <p class="text-xs sm:text-sm text-slate-300">${c.msg}</p>
                </div>
            `).join('');
        }

        function addComment(e) {
            e.preventDefault();
            const user = document.getElementById('comment-user').value;
            const msg = document.getElementById('comment-msg').value;
            const vid = videos.find(v => v.id === currentVideoId);
            if (vid) {
                if (!vid.comments) vid.comments = [];
                vid.comments.unshift({ user, msg });
                renderComments(vid.comments);
                e.target.reset();
            }
        }

        playVideo(currentVideoId);
    </script>
</body>
</html>
