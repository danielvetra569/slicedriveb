
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoKu - Admin</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f6fa;margin:0;padding:20px;color:#202331}
.container{max-width:600px;margin:25px auto;background:white;padding:22px;border-radius:12px}
h2{color:#635bdb}
input,textarea{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ccc;border-radius:7px;font-size:15px}
textarea{min-height:80px}
button{width:100%;padding:14px;background:#635bdb;color:white;border:0;border-radius:7px;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
#hasil{margin-top:18px;overflow-wrap:anywhere}
a{color:#635bdb}
#status{margin-top:15px}
</style>
</head>

<body>
<div class="container">
<h2>VideoKu Admin</h2>

<label>Password Admin</label>
<input type="password" id="password" placeholder="Password admin">

<label>Judul Video</label>
<input id="title" placeholder="Judul video">

<label>Deskripsi</label>
<textarea id="description" placeholder="Deskripsi video (boleh kosong)"></textarea>

<label>URL Video AceImg</label>
<input id="url" placeholder="https://aceimg.com/contoh.mp4">

<button id="saveButton" onclick="simpanVideo()">Simpan Video</button>
<div id="status"></div>
<div id="hasil"></div>
</div>

<script>
async function simpanVideo(){
  const password=document.getElementById("password").value.trim();
  const title=document.getElementById("title").value.trim();
  const description=document.getElementById("description").value.trim();
  let url=document.getElementById("url").value.trim();

  const status=document.getElementById("status");
  const hasil=document.getElementById("hasil");
  const button=document.getElementById("saveButton");

  hasil.textContent="";

  if(!password||!title||!url){
    status.textContent="Isi password, judul, dan URL video.";
    return;
  }

  let parsed;
  try{parsed=new URL(url)}catch(e){
    status.textContent="URL tidak valid.";
    return;
  }

  if(parsed.protocol!=="https:"||
     !["aceimg.com","www.aceimg.com","cdn.aceimg.com"].includes(parsed.hostname)){
    status.textContent="Gunakan URL HTTPS dari AceImg.";
    return;
  }

  if(parsed.hostname==="aceimg.com"||parsed.hostname==="www.aceimg.com"){
    parsed.hostname="cdn.aceimg.com";
    url=parsed.toString();
  }

  const code=Array.from(crypto.getRandomValues(new Uint8Array(5)))
    .map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();

  button.disabled=true;
  status.textContent="Sedang menyimpan video...";

  try{
    const response=await fetch(
      "https://hidden-recipe-88ca.danielvetra569.workers.dev/add-video",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({password,code,title,description,url})
      }
    );

    const result=await response.json();

    if(!response.ok||!result.success){
      throw new Error(result.error+
        (result.status?" (HTTP "+result.status+")":"")+
        (result.detail?" — "+result.detail:""));
    }

    // FORMAT LINK PENONTON BARU
    const link="https://cdn.aciemg.my.id/e."+code+".mp4";

    status.textContent="Video berhasil disimpan!";
    hasil.innerHTML=
      "<p><b>Kode:</b> "+code+"</p>"+
      "<p><b>URL CDN:</b><br>"+url+"</p>"+
      "<p><b>Link penonton:</b><br><a href='"+link+"' target='_blank'>"+link+"</a></p>";

    const copy=document.createElement("button");
    copy.textContent="Salin Link Penonton";
    copy.onclick=()=>navigator.clipboard.writeText(link).then(
      ()=>alert("Link disalin!")
    );
    hasil.appendChild(copy);

  }catch(error){
    status.textContent="Gagal: "+error.message;
  }finally{
    button.disabled=false;
  }
}
</script>

</body>
</html>
