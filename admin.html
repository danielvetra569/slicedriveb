
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - VideoKu</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="./">VideoKu</a>
  <a class="admin-link" href="./">Lihat Website</a>
</header>

<main class="admin-container">
  <section class="hero">
    <p class="eyebrow">PENGELOLAAN WEBSITE</p>
    <h1>Admin VideoKu</h1>
    <p>Masuk untuk mengelola koleksi video.</p>
  </section>

  <section class="panel" id="loginBox">
    <h2>Login Admin</h2>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required placeholder="Email akun admin">
      <label>Password</label>
      <input id="password" type="password" required placeholder="Password">
      <button class="primary-button" type="submit">Masuk</button>
    </form>
    <p id="loginStatus" class="status"></p>
  </section>

  <section class="panel" id="adminBox" hidden>
    <div class="panel-heading">
      <div>
        <h2>Upload Video</h2>
        <p class="muted">Pilih video dari perangkat kamu.</p>
      </div>
      <button id="logoutButton" class="secondary" type="button">Keluar</button>
    </div>

    <form id="uploadForm">
      <label>Judul video</label>
      <input id="title" type="text" required placeholder="Masukkan judul video">
      <label>Deskripsi</label>
      <textarea id="description" rows="3" placeholder="Deskripsi video"></textarea>
      <label>File video</label>
      <input id="videoFile" type="file" accept="video/*" required>
      <button class="primary-button" type="submit">Upload Video</button>
    </form>

    <p id="uploadStatus" class="status"></p>

    <hr>
    <h2>Daftar Video</h2>
    <div id="manageList" class="manage-list">Memuat...</div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://kbesxoueqynthvqtayww.supabase.co";
const SUPABASE_KEY = "sb_publishable_IBnGOZUeFE6NMg62eZTxbA_6UNASmOv";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");
const loginStatus = document.getElementById("loginStatus");
const uploadStatus = document.getElementById("uploadStatus");
const manageList = document.getElementById("manageList");

async function perbaruiTampilan() {
  const { data } = await db.auth.getSession();
  const session = data.session;
  loginBox.hidden = !!session;
  adminBox.hidden = !session;
  if (session) muatDaftar();
}

document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  loginStatus.textContent = "Sedang masuk...";
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });
  loginStatus.textContent = error ? error.message : "Login berhasil.";
  if (!error) perbaruiTampilan();
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  perbaruiTampilan();
});

document.getElementById("uploadForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const file = document.getElementById("videoFile").files[0];

  if (!file) return;

  uploadStatus.textContent = "Sedang mengunggah video...";

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = Date.now() + "_" + safeName;

  const { error: uploadError } = await db.storage.from("videos").upload(path, file);

  if (uploadError) {
    uploadStatus.textContent = "Upload gagal: " + uploadError.message;
    return;
  }

  const { data: savedVideo, error: insertError } = await db
    .from("videos")
    .insert({
      title,
      description,
      storage_path: path
    })
    .select("share_code")
    .single();

  if (insertError || !savedVideo) {
    await db.storage.from("videos").remove([path]);
    uploadStatus.textContent = "Gagal menyimpan data: " +
      (insertError ? insertError.message : "Data tidak ditemukan");
    return;
  }

  if (!savedVideo.share_code) {
    uploadStatus.textContent = "Video tersimpan, tetapi kode unik tidak ditemukan.";
    document.getElementById("uploadForm").reset();
    muatDaftar();
    return;
  }

  const shareUrl = "https://cdn.aciemg.my.id/e/" + savedVideo.share_code;

  uploadStatus.textContent = "Video berhasil diunggah! Link penonton: ";

  const link = document.createElement("a");
  link.href = shareUrl;
  link.textContent = shareUrl;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  uploadStatus.appendChild(document.createElement("br"));
  uploadStatus.appendChild(link);

  const copyButton = document.createElement("button");
  copyButton.type = "button";
  copyButton.className = "secondary";
  copyButton.textContent = "Salin Link";

  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      copyButton.textContent = "Link Tersalin!";
    } catch {
      copyButton.textContent = "Salin manual dari link di atas";
    }
  });

  uploadStatus.appendChild(document.createElement("br"));
  uploadStatus.appendChild(copyButton);

  document.getElementById("uploadForm").reset();
  muatDaftar();
});

async function muatDaftar() {
  manageList.textContent = "Memuat daftar video...";

  const { data, error } = await db.from("videos")
    .select("*").order("created_at", { ascending: false });

  if (error) {
    manageList.textContent = "Gagal memuat: " + error.message;
    return;
  }

  manageList.innerHTML = "";

  if (!data.length) {
    manageList.textContent = "Belum ada video.";
    return;
  }

  data.forEach((video) => {
    const item = document.createElement("div");
    item.className = "manage-item";

    const name = document.createElement("strong");
    name.textContent = video.title || "Tanpa judul";

    item.appendChild(name);

    if (video.share_code) {
      const link = document.createElement("a");
      link.href = "https://cdn.aciemg.my.id/e/" + video.share_code;
      link.textContent = "Buka Link Penonton";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      item.appendChild(document.createElement("br"));
      item.appendChild(link);
    }

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.type = "button";
    remove.textContent = "Hapus";

    remove.addEventListener("click", async () => {
      if (!confirm("Yakin ingin menghapus video ini?")) return;

      remove.disabled = true;

      const { error: storageError } = await db.storage.from("videos").remove([video.storage_path]);

      if (storageError) {
        alert("Gagal menghapus file: " + storageError.message);
        remove.disabled = false;
        return;
      }

      const { error: rowError } = await db.from("videos").delete().eq("id", video.id);

      if (rowError) {
        alert("File terhapus, tetapi data gagal dihapus: " + rowError.message);
      }

      muatDaftar();
    });

    item.appendChild(remove);
    manageList.appendChild(item);
  });
}

db.auth.onAuthStateChange(() => {
  setTimeout(perbaruiTampilan, 0);
});

perbaruiTampilan();
</script>
</body>
</html>
